name: track-ophub

# Daily: when ophub publishes a newer 6.1.x rk35xx kernel, build it as a
# prerelease. Promote it to a release after it passes on hardware
# (px2-npu-vpu try <tag> runs the acceptance test on the box).
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      kernel: ${{ steps.c.outputs.kernel }}
      new: ${{ steps.c.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kernel=$(gh api repos/ophub/kernel/releases/tags/kernel_rk35xx --jq '.assets[].name' |
            grep -E '^6\.1\.[0-9]+\.tar\.gz$' | sed 's/\.tar\.gz$//' | sort -V | tail -1)
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          if gh release view "k$kernel" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "ophub has $kernel, building k$kernel as a prerelease"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/build.yml
    with:
      kernel_version: ${{ needs.check.outputs.kernel }}
      release: prerelease
